<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Global Creative Protocol</title>
<style>
:root{
  --bg:#fff;
  --card:#f7f7f7;
  --text:#111;
  --gray:#666;
  --border:#ddd;
  --primary:#0070f3;
}
.dark{
  --bg:#121212;
  --card:#1e1e1e;
  --text:#eee;
  --gray:#aaa;
  --border:#333;
  --primary:#3399ff;
}
*{box-sizing:border-box}
body{
  margin:0;
  padding:20px;
  background:var(--bg);
  color:var(--text);
  font-family:system-ui, sans-serif;
  line-height:1.7;
  max-width:1200px;
  margin:0 auto;
  transition:.2s;
}

/* 顶部 */
.top-bar{
  position:fixed;
  top:0; left:0; right:0;
  background:var(--bg);
  padding:14px 20px;
  border-bottom:1px solid var(--border);
  display:flex;
  justify-content:space-between;
  align-items:center;
  z-index:9999;
}
.btn{
  padding:8px 14px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  background:var(--primary);
  color:#fff;
}
.btn-outline{
  background:transparent;
  color:var(--primary);
  border:1px solid var(--primary);
}
.theme-btn{
  background:transparent;
  border:1px solid var(--border);
  width:36px; height:36px;
  border-radius:50%;
  cursor:pointer;
  color:var(--text);
}

/* 弹窗 */
.modal{
  display:none;
  position:fixed;
  top:0;left:0;right:0;bottom:0;
  background:rgba(0,0,0,0.5);
  justify-content:center;
  align-items:center;
  z-index:99999;
}
.modal-box{
  background:var(--bg);
  padding:24px;
  border-radius:12px;
  width:90%;
  max-width:500px;
}
.modal-box input,
.modal-box textarea,
.modal-box select{
  width:100%;
  padding:10px;
  margin:6px 0;
  border:1px solid var(--border);
  border-radius:8px;
  background:var(--card);
  color:var(--text);
}

/* 身份卡片 */
.card{
  background:var(--card);
  padding:24px;
  border-radius:12px;
  margin:80px 0 20px;
}
.identity{
  font-size:30px;
  font-weight:bold;
  margin:10px 0;
  cursor:pointer;
}
.key-box{
  background:var(--bg);
  padding:12px;
  border-radius:8px;
  font-family:monospace;
  word-break:break-all;
  margin:10px 0;
}

/* 作品网格 */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
  gap:16px;
  margin:20px 0;
}
.work-card{
  background:var(--card);
  border-radius:12px;
  overflow:hidden;
}
.work-card video,
.work-card audio{
  width:100%;
}
.work-info{
  padding:14px;
}
.work-info h4{
  margin:0 0 6px;
}
.work-info small{
  color:var(--gray);
}
.like-btn{
  background:none;
  border:none;
  color:#f34;
  cursor:pointer;
  padding:4px 0;
  font-size:14px;
}

/* 评论 */
.comment{
  padding:8px 12px;
  background:var(--bg);
  border-radius:8px;
  margin-top:8px;
  font-size:14px;
}

/* 创作者主页 */
.profile{
  display:none;
  background:var(--card);
  padding:24px;
  border-radius:12px;
  margin:20px 0;
}
.profile h2{
  margin-top:0;
}
.back-btn{
  background:var(--card);
  border:1px solid var(--border);
  padding:8px 14px;
  border-radius:8px;
  cursor:pointer;
  color:var(--text);
}
</style>
</head>

<body>

<!-- 顶部栏 -->
<div class="top-bar">
  <div>
    <button class="btn" onclick="showRestore()">恢复身份</button>
    <button class="btn btn-outline" onclick="showUpload()" style="margin-left:8px">发布作品</button>
  </div>
  <button class="theme-btn" onclick="toggleTheme()">🌙</button>
</div>

<!-- 恢复身份 -->
<div class="modal" id="restoreModal">
  <div class="modal-box">
    <h3>恢复身份</h3>
    <input id="restoreKey" placeholder="输入你的密钥">
    <button class="btn" onclick="doRestore()">确认恢复</button>
    <button class="btn btn-outline" onclick="closeAllModal()">取消</button>
  </div>
</div>

<!-- 上传 -->
<div class="modal" id="uploadModal">
  <div class="modal-box">
    <h3>发布作品</h3>
    <select id="workType">
      <option value="video">视频</option>
      <option value="music">音乐</option>
      <option value="game">游戏</option>
    </select>
    <input id="workTitle" placeholder="标题">
    <textarea id="workDesc" placeholder="简介" rows="3"></textarea>
    <input type="file" id="workFile" accept="video/*,audio/*,.html,.zip">
    <button class="btn" onclick="publishWork()">发布</button>
    <button class="btn btn-outline" onclick="closeAllModal()">取消</button>
  </div>
</div>

<!-- 评论 -->
<div class="modal" id="commentModal">
  <div class="modal-box">
    <h3>发表评论</h3>
    <input type="hidden" id="commentWorkId">
    <input id="commentText" placeholder="说点什么...">
    <button class="btn" onclick="sendComment()">发送</button>
    <button class="btn btn-outline" onclick="closeAllModal()">取消</button>
  </div>
</div>

<!-- 身份 -->
<div class="card" id="identityCard">
  <div>你是全球第 <b id="visitNum">0</b> 位共建者</div>
  <div class="identity" id="myId" onclick="goProfile()">GCP-0</div>
  <div style="color:red">你的密钥（务必保存）:</div>
  <div class="key-box" id="myKey"></div>
</div>

<!-- 创作者主页 -->
<div class="profile" id="profilePage">
  <button class="back-btn" onclick="backHome()">← 返回主页</button>
  <h2>创作者主页</h2>
  <div id="profileInfo"></div>
  <h3>TA的作品</h3>
  <div class="grid" id="profileWorks"></div>
</div>

<!-- 内容区 -->
<div id="mainContent">
  <h2>📺 视频</h2>
  <div class="grid" id="videoList"></div>

  <h2>🎵 音乐</h2>
  <div class="grid" id="musicList"></div>

  <h2>🎮 游戏</h2>
  <div class="grid" id="gameList"></div>
</div>

<br><br><br>
<div style="text-align:center;padding:40px;color:var(--gray)">
  Global Creative Protocol<br>
  由全人类共同拥有 · 无服务器 · 无法关闭
</div>

<script>
const $ = s => document.querySelector(s)
const rand = () => Math.random().toString(36).slice(2,10)

// 主题切换
function toggleTheme(){
  document.body.classList.toggle('dark')
  localStorage.setItem('dark', document.body.classList.contains('dark'))
}
if(localStorage.getItem('dark') === 'true'){
  document.body.classList.add('dark')
}

// 弹窗
const closeAllModal = () => {
  $('#restoreModal').style.display='none'
  $('#uploadModal').style.display='none'
  $('#commentModal').style.display='none'
}
const showRestore = () => {$('#restoreModal').style.display='flex'}
const showUpload = () => {$('#uploadModal').style.display='flex'}

// 访问计数 & 身份
let visit = +localStorage.getItem('GCP_VISIT') || 0
let myId = localStorage.getItem('GCP_ID')
let myKey = localStorage.getItem('GCP_KEY')

if(!myId){
  visit++
  localStorage.setItem('GCP_VISIT', visit)
  myId = 'GCP-'+(visit-1)
  myKey = myId+'_'+rand()+rand()
  localStorage.setItem('GCP_ID', myId)
  localStorage.setItem('GCP_KEY', myKey)
}

$('#visitNum').innerText = visit
$('#myId').innerText = myId
$('#myKey').innerText = myKey

// 恢复身份
function doRestore(){
  const k = $('#restoreKey').value.trim()
  if(!k || !k.startsWith('GCP-')) return alert('密钥无效')
  const id = k.split('_')[0]
  localStorage.setItem('GCP_ID', id)
  localStorage.setItem('GCP_KEY', k)
  location.reload()
}

// 发布作品
function publishWork(){
  const t = $('#workType').value
  const title = $('#workTitle').value.trim()
  const desc = $('#workDesc').value.trim()
  const file = $('#workFile').files[0]
  if(!title || !file) return alert('请填写完整')
  const url = URL.createObjectURL(file)
  const work = {
    id:'W'+Date.now(), type:t, title, desc, url,
    author:myId, likes:0, comments:[]
  }
  const list = JSON.parse(localStorage.getItem('GCP_WORKS')||'[]')
  list.push(work)
  localStorage.setItem('GCP_WORKS', JSON.stringify(list))
  closeAllModal()
  renderAll()
  alert('发布成功！')
}

// 点赞
function like(wid){
  const list = JSON.parse(localStorage.getItem('GCP_WORKS')||'[]')
  const i = list.findIndex(x=>x.id===wid)
  if(i<0)return
  list[i].likes = (list[i].likes||0)+1
  localStorage.setItem('GCP_WORKS', JSON.stringify(list))
  renderAll()
}

// 评论
function openComment(wid){
  $('#commentWorkId').value = wid
  $('#commentModal').style.display='flex'
}
function sendComment(){
  const wid = $('#commentWorkId').value
  const txt = $('#commentText').value.trim()
  if(!txt)return
  const list = JSON.parse(localStorage.getItem('GCP_WORKS')||'[]')
  const i = list.findIndex(x=>x.id===wid)
  if(i<0)return
  list[i].comments = list[i].comments||[]
  list[i].comments.push({author:myId, text:txt})
  localStorage.setItem('GCP_WORKS', JSON.stringify(list))
  closeAllModal()
  renderAll()
}

// 创作者主页
function goProfile(uid=null){
  const id = uid || myId
  const all = JSON.parse(localStorage.getItem('GCP_WORKS')||'[]')
  const mine = all.filter(x=>x.author===id)
  $('#profileInfo').innerHTML = `<b>ID：${id}</b><br>作品数：${mine.length}`
  $('#profileWorks').innerHTML = ''
  mine.forEach(w=>{
    const div=document.createElement('div')
    div.className='work-card'
    let m=''
    if(w.type==='video') m=`<video controls src="${w.url}"></video>`
    if(w.type==='music') m=`<audio controls src="${w.url}">`
    div.innerHTML=m+`<div class="work-info"><h4>${w.title}</h4></div>`
    $('#profileWorks').appendChild(div)
  })
  $('#identityCard').style.display='none'
  $('#mainContent').style.display='none'
  $('#profilePage').style.display='block'
}
function backHome(){
  $('#identityCard').style.display='block'
  $('#mainContent').style.display='block'
  $('#profilePage').style.display='none'
}

// 渲染全部
function renderAll(){
  const list = JSON.parse(localStorage.getItem('GCP_WORKS')||'[]')
  $('#videoList').innerHTML=$('#musicList').innerHTML=$('#gameList').innerHTML=''
  list.forEach(w=>{
    const div=document.createElement('div')
    div.className='work-card'
    let m=''
    if(w.type==='video') m=`<video controls src="${w.url}"></video>`
    if(w.type==='music') m=`<audio controls src="${w.url}">`
    div.innerHTML = `
      ${m}
      <div class="work-info">
        <h4>${w.title}</h4>
        <small>${w.desc}</small><br>
        <small onclick="goProfile('${w.author}')" style="cursor:pointer;color:var(--primary)">作者：${w.author}</small>
        <div>
          <button class="like-btn" onclick="like('${w.id}')">❤️ ${w.likes||0}</button>
          <button class="like-btn" onclick="openComment('${w.id}')">💬 ${(w.comments||[]).length}</button>
        </div>
        ${(w.comments||[]).map(c=>`
          <div class="comment"><b>${c.author}</b>: ${c.text}</div>
        `).join('')}
        ${w.type==='game'?`<a href="${w.url}" target="_blank" class="btn" style="margin-top:10px;display:inline-block">打开游戏</a>`:''}
      </div>
    `
    if(w.type==='video') $('#videoList').appendChild(div)
    if(w.type==='music') $('#musicList').appendChild(div)
    if(w.type==='game') $('#gameList').appendChild(div)
  })
}

renderAll()
</script>
</body>
</html>
